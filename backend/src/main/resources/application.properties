# H2 (Fallback/Test)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring AI OpenAI Configuration
spring.ai.openai.api-key=ctx7sk-4a9bbe9f-412f-406d-ab0a-510328fb2ec6
spring.ai.openai.base-url=http://llm.ycbjkim.com
spring.ai.openai.chat.options.model=yc-gemma-3-27b
spring.ai.openai.chat.options.temperature=0


spring.ai.openai.chat.options.response-format.type=json_object

# Multipart File Upload Limits (for PDF)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Java 21 Virtual Threads Support
spring.threads.virtual.enabled=true


# Logging Configuration
logging.level.org.springframework.security=DEBUG
logging.level.com.hiresync=DEBUG
