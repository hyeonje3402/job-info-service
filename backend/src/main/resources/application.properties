spring.application.name=hiresync
server.port=8081

# Database Configuration (H2 File-based)
spring.datasource.url=jdbc:h2:file:./data/hiresync;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Change to 'create' to force schema recreation
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# Enable SQL initialization to run schema.sql
spring.sql.init.mode=always

# Spring AI OpenAI Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=http://llm.ycbjkim.com
spring.ai.openai.chat.options.model=yc-gemma-4-26b-a4b
spring.ai.openai.chat.options.temperature=0

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Virtual Threads
spring.threads.virtual.enabled=true

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.hiresync=DEBUG
